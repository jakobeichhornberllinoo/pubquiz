<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2864">
<title>ASIUM Pub-Quiz – Mitspielen</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ph">
  <div class="ph-top"><img src="img/logo.png" alt="ASIUM"><div><div class="k">PUB-QUIZ</div><div class="t">Außen- und Sicherheitspolitik</div></div></div>
  <h1>Mitspielen beim <span class="mag">PUB-QUIZ</span></h1>
  <p>Den Code vom Beamer eingeben – oder einfach den QR-Code scannen.</p>
  <form id="f" autocomplete="off">
    <input class="field code" id="code" maxlength="8" placeholder="CODE" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Spiel-Code">
    <button class="btn pri big" type="submit">Weiter</button>
  </form>
  <div class="foot2"><span></span><span class="muted">ASIUM · Uni Münster</span></div>
</div>
<script src="icons.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="db.js"></script>
<script src="online.js"></script>
<script src="start.js"></script>
</body>
</html>
